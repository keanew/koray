<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Koray">
  <title>Koray</title>
  <defs>
    <linearGradient id="korayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="55%" stop-color="#2E9C97"/>
      <stop offset="100%" stop-color="#173B47"/>
    </linearGradient>
    <linearGradient id="korayK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE66D"/>
    </linearGradient>
    <filter id="korayShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B1A24" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded square badge -->
  <rect x="8" y="8" width="184" height="184" rx="48" fill="url(#korayBg)" filter="url(#korayShadow)"/>

  <!-- Sun / accent dot -->
  <circle cx="150" cy="52" r="15" fill="#FFE66D" opacity="0.95"/>

  <!-- Stylised K: stem + wave arms -->
  <g fill="none" stroke="url(#korayK)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 56 L64 144"/>
    <path d="M64 100 C 86 78, 106 66, 132 58"/>
    <path d="M64 100 C 88 112, 108 128, 130 142"/>
  </g>

  <!-- Tropical wave underline -->
  <path d="M40 162 C 60 150, 80 174, 100 162 C 120 150, 140 174, 160 162"
        fill="none" stroke="#FF6B6B" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
</svg>
